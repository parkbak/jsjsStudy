<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직소 퍼즐 게임</title>
    <link href="puzzle.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<body>

        <div class="title">
            <span>직소 퍼즐 맞추기 게임</span>

            <input type="text" placeholder="닉네임을 입력해주세요." id="userNameInput" class="login-input"/>
            <input type="text" id="randomCodeInput" readonly class="login-input"/>
            <button id="goToMainBtn" class="login-btn">➔</button>
        </div>
    </div>

<script src="puzzle.js"></script>
