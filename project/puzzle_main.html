<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직소 퍼즐 게임</title>
    <link href="puzzle.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <div class="container">
        <div class="title">
            <span>직소 퍼즐 맞추기 게임</span>
        </div>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-content">
                <div class="upload-icon">📁</div>
                <div class="upload-text">이미지 업로드</div>
            </div>
        </div>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" />
        
        <div class="canvas-container" id="canvasContainer" style="display: none;">
            <canvas id="imageCanvas" width="500" height="500"></canvas>
        </div>
        
        <div class="button-container">
            <button class="puzzle-btn record-btn" id="recordBtn">
                <span>기록 보기</span>
            </button>
            <button class="puzzle-btn start-btn" id="startBtn" disabled>
                <span>게임 시작</span>
            </button>
        </div>
    </div>

    <script src="puzzle.js"></script>
</body>
</html>
