<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직소 퍼즐 게임</title>
    <link href="puzzle.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"
        integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>
    <!-- 사운드 효과 -->
    <audio id="snapSound" preload="auto">
        <source
            src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT"
            type="audio/wav">
    </audio>

    <div class="container">
        <div class="title">
            <span>직소 퍼즐 맞추기 게임</span>
        </div>

        <!-- 타이머 영역 추가 -->
        <div class="timer-container" id="timerContainer" style="display: none;">
            <div class="timer">
                <span class="timer-label">경과 시간:</span>
                <span class="timer-display" id="timerDisplay">00:00</span>
            </div>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-content">
                <div class="upload-icon">📁</div>
                <div class="upload-text">이미지 업로드</div>
            </div>
        </div>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" />

        <div class="canvas-container" id="canvasContainer" style="display: none;">
            <canvas id="imageCanvas" width="500" height="500"></canvas>
        </div>

        <div class="gaem-container"></div>

        <div class="button-container">
            <button class="puzzle-btn record-btn" id="recordBtn">
                <span>기록 보기</span>
            </button>
            <button class="puzzle-btn start-btn" id="startBtn" disabled>
                <span>게임 시작</span>
            </button>
        </div>

        <!-- 게임 중 버튼 컨테이너 -->
        <div class="game-button-container" id="gameButtonContainer" style="display: none;">
            <button class="puzzle-btn record-btn" id="hintBtn">
                <span>힌트 보기</span>
            </button>
            <button class="puzzle-btn start-btn" id="checkBtn">
                <span>결과 확인</span>
            </button>
        </div>
    </div>

    <script src="puzzle.js"></script>
    <script src="records.js"></script>
</body>

</html>
